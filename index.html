<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELVA</title>
  <meta name="description" content="A private cultural community. By invitation only.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <!-- TODO: replace with custom letterform master SVG. brand rule: never recreate in a typeface. -->
    <h1 class="wordmark">SELVA</h1>
    <p class="tagline">by invitation</p>
    <form class="capture" onsubmit="event.preventDefault()">
      <input type="email" name="email" placeholder="email" required aria-label="email">
      <button type="submit" aria-label="submit">&rarr;</button>
    </form>
  </main>
</body>
</html>
